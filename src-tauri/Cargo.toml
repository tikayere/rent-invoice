[package]
name = "rent-invoice-manager"
version = "1.0.0"
description = "Application desktop de gestion et generation de factures de loyer"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "rent_invoice_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
printpdf = { version = "0.9", default-features = false, features = ["png", "jpeg", "text_layout"] }
thiserror = "2"
csv = "1.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
